---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: clickhouse-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        clickhouse_debug_service_enabled: false

        # Variables for ClickHouse
        clickhouse_uid: 1000
        clickhouse_gid: 1000
        clickhouse_root_password: password

        # The role publishes no ports by default. Binding the HTTP interface to
        # the loopback address of the test container lets the verifier query
        # ClickHouse over HTTP, and exercises the port-publishing branch of the
        # systemd unit template on the way.
        clickhouse_container_http_host_bind_port: "127.0.0.1:8123"
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
