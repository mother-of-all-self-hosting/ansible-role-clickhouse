---
- name: Ensure ClickHouse service is started
  ansible.builtin.service:
    name: "{{ clickhouse_identifier }}"
    state: started
    daemon_reload: true
  register: clickhouse_ensure_started_result

- name: Wait a bit, so that ClickHouse can start
  when: "clickhouse_ensure_started_result.changed | bool and (clickhouse_managed_databases_service_start_wait_timeout_seconds | int) > 0"
  ansible.builtin.wait_for:
    timeout: "{{ clickhouse_managed_databases_service_start_wait_timeout_seconds }}"
  delegate_to: 127.0.0.1
  become: false

- name: Detect managed databases with invalid fields
  ansible.builtin.set_fact:
    clickhouse_managed_databases_with_missing_keys: >-
      {%- set result = [] -%}
      {%- for db in clickhouse_managed_databases -%}
        {%- set missing = ['name', 'username', 'password'] | difference(db.keys() | list) -%}
        {%- if missing | length > 0 -%}
          {%- set _ = result.append({'name': db.name | default('<unknown>'), 'missing': missing}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}
  no_log: true

- name: Fail if managed database data appears invalid
  ansible.builtin.fail:
    msg: >-
      The following managed database definitions lack required keys:
      {% for db in clickhouse_managed_databases_with_missing_keys %}
      {{ db.name }} (missing: {{ db.missing | join(', ') }}){% if not loop.last %}, {% endif %}
      {% endfor %}
  when: clickhouse_managed_databases_with_missing_keys | length > 0

# Only the statements needed are run (see the module), so that this only reports a change when something did change.
# SQL is passed to the client on stdin, so that passwords do not end up in files or on command lines.
- name: Ensure managed databases are prepared
  when: clickhouse_managed_databases | length > 0
  clickhouse_managed_databases:
    # The client runs inside the (already started) ClickHouse container, as the superuser
    # that the container's environment (see the `env` file) defines.
    docker_command: "{{ devture_systemd_docker_base_host_command_docker.split() }}"
    container: "{{ clickhouse_identifier }}"
    # Only the keys the module knows about are passed (definitions may contain others).
    databases: |-
      {%- set result = [] -%}
      {%- for db in clickhouse_managed_databases -%}
        {%- set _ = result.append({
          'name': db.name,
          'username': db.username,
          'password': db.password | string,
          'additional_sql': db.additional_sql | default(''),
        }) -%}
      {%- endfor -%}
      {{ result }}
    connection_retries: "{{ clickhouse_managed_databases_connection_retries }}"
    connection_retry_delay_seconds: "{{ clickhouse_managed_databases_connection_retry_delay_seconds }}"
  register: clickhouse_managed_databases_preparation_result

- name: Ensure ClickHouse systemd service is stopped (if it previously was)
  when: clickhouse_ensure_started_result.changed | bool
  ansible.builtin.service:
    name: "{{ clickhouse_identifier }}"
    state: stopped
